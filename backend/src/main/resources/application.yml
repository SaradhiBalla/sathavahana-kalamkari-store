spring:
  application:
    name: kalamkari-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:kalamkari;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
server:
  port: ${PORT:8080}
  shutdown: graceful
app:
  auth:
    secret: ${AUTH_TOKEN_SECRET:local-development-secret-change-me-please-32}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${HEALTH_SHOW_DETAILS:never}
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
