spring:
  application:
    name: kalamkari-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:kalamkari;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
server:
  port: ${PORT:8080}
app:
  auth:
    secret: ${AUTH_TOKEN_SECRET:local-development-secret-change-me-please-32}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
